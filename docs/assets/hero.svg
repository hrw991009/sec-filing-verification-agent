    <g fill="#183243" stroke="#3a6775"><rect x="727" y="94" width="160" height="78" rx="12"/><rect x="727" y="195" width="160" height="78" rx="12"/><rect x="1010" y="142" width="145" height="78" rx="12"/><rect x="1210" y="142" width="165" height="78" rx="12"/></g>
    <g text-anchor="middle" fill="#f3f8fb" font-size="17"><text x="807" y="137">SEC Filing</text><text x="807" y="238">XBRL Facts</text><text x="1082" y="185">Calculate</text><text x="1292" y="185" fill="#82e9ca">Verify</text></g>
