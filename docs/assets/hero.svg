<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">SEC Filing Verification Agent</title>
  <desc id="desc">Decorative banner connecting financial sources to reproducible calculations and evidence.</desc>
  <defs>
