[project]
name = "industry-intelligence-platform"
version = "0.1.0"
description = "A multimodal industry intelligence workspace."
readme = "README.md"
requires-python = "==3.13.14"
dependencies = []

[tool.uv]
package = false
required-version = "==0.11.32"

[tool.uv.workspace]
members = ["apps/backend"]

[dependency-groups]
dev = [
    "httpx2>=2.9.1,<3.0.0",
    "markdown-it-py==4.2.0",
    "mypy>=2.3.0,<3.0.0",
    "pip-licenses==5.5.5",
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "reportlab>=4.4.0,<5.0.0",
    "ruff>=0.16.1,<0.17.0",
    "semgrep==1.175.0",
    "sympy>=1.14.0,<2.0.0",
    "types-reportlab>=4.4.0,<5.0.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["apps/backend/src"]

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "DTZ",
  "E",
  "F",
  "I",
  "PT",
  "RUF",
  "S",
  "SIM",
  "T20",
  "UP",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"apps/backend/tests/**/*.py" = ["S101"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
mypy_path = ["apps/backend/src", "apps/backend/tests"]
explicit_package_bases = true
files = [
  "apps/backend/src",
  "apps/backend/tests",
  "evals/generators",
]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "croniter", "kombu", "kombu.*", "sympy", "sympy.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pip-licenses]
from = "mixed"
ignore-packages = ["industry-platform-backend", "face", "peewee"]
allow-only = "3-Clause BSD License;Apache Software License;Apache-2.0;Apache-2.0 OR BSD-2-Clause;Apache-2.0 OR BSD-3-Clause;Apache-2.0 OR MIT;BSD;BSD License;Public Domain;BSD-2-Clause;BSD-3-Clause;BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0;BSD-3-Clause, Apache-2.0, dependency licenses;ISC License (ISCL);LGPL-2.1-or-later;LGPL-3.0-only;MIT;MIT AND PSF-2.0;MIT License;MIT-0;MIT-CMU;MPL-2.0 AND (Apache-2.0 OR MIT);MPL-2.0 AND MIT;Mozilla Public License 2.0 (MPL 2.0);PSF-2.0;Python Software Foundation License;The Unlicense (Unlicense)"

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
  "--strict-config",
  "--strict-markers",
  "-ra",
]
markers = [
  "migration_smoke: runs the full Alembic history against disposable PostgreSQL",
]
testpaths = ["apps/backend/tests"]
xfail_strict = true
filterwarnings = ["error"]
