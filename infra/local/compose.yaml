name: sec-filing-local

x-backend: &backend
  image: sec-filing-agent-backend:local
  pull_policy: never
  env_file: ../../.data/local/runtime.env
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
  depends_on:
    migrate:
      condition: service_completed_successfully
    minio-init:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    milvus:
      condition: service_healthy
    elasticsearch:
      condition: service_healthy

services:
  postgres:
    extends:
      file: ../compose/compose.yaml
      service: postgres
    ports: !reset []
  redis:
    extends:
      file: ../compose/compose.yaml
      service: redis
    ports: !reset []
  minio:
    extends:
      file: ../compose/compose.yaml
      service: minio
    ports: !reset []
  minio-init:
    extends:
      file: ../compose/compose.yaml
      service: minio-init
  etcd:
    extends:
      file: ../compose/compose.yaml
      service: etcd
    profiles: !reset []
  milvus:
    extends:
      file: ../compose/compose.yaml
      service: milvus
    profiles: !reset []
    ports: !reset []
  elasticsearch:
    extends:
      file: ../compose/compose.yaml
      service: elasticsearch
    profiles: !reset []
    ports: !reset []
  migrate:
    image: sec-filing-agent-backend:local
    pull_policy: never
    env_file: ../../.data/local/runtime.env
    command: ["python", "-m", "alembic", "-c", "apps/backend/alembic.ini", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *backend
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=15)",
        ]
      interval: 15s
      timeout: 20s
      retries: 12
      start_period: 30s
  worker:
    <<: *backend
    command:
      ["python", "-m", "industry_platform.workers.celery_app", "--concurrency=2", "--loglevel=INFO"]
  dispatcher:
    <<: *backend
    command: ["python", "-m", "industry_platform.workers.dispatcher"]
  reconciler:
    <<: *backend
    command: ["python", "-m", "industry_platform.workers.reconciler"]
  beat:
    <<: *backend
    command:
      [
        "python",
        "-m",
        "industry_platform.workers.beat",
        "--pidfile=/tmp/beat.pid",
        "--schedule=/tmp/beat-schedule",
        "--loglevel=INFO",
      ]
  web:
    image: sec-filing-agent-web:local
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - ../../.data/local/certs:/etc/local-tls:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-check-certificate",
          "-q",
          "--spider",
          "https://127.0.0.1:8443/health/ready",
        ]
      interval: 15s
      timeout: 20s
      retries: 10
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  etcd_data:
  milvus_data:
  elasticsearch_data:
