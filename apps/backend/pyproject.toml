[project]
name = "industry-platform-backend"
version = "0.1.0"
description = "Backend application for Industry Intelligence Platform."
requires-python = "==3.13.14"
dependencies = [
    "fastapi>=0.141.1,<0.142.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "redis>=8.1.0,<9.0.0",
    "sqlalchemy[asyncio]>=2.0.51,<3.0.0",
    "uvicorn[standard]>=0.52.1,<0.53.0",
]

[project.scripts]
industry-platform-api = "industry_platform.server:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "industry_platform"
module-root = "src"
