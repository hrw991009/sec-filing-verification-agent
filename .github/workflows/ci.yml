name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pinned Python
        run: uv python install

      - name: Sync locked Python workspace
        run: uv sync --locked --all-packages

      - name: Verify Python toolchain
        run: |
          uv --version
          uv run --locked python --version

      - name: Check Python formatting
        run: uv run --locked --all-packages ruff format --check --config pyproject.toml apps/backend evals/generators

      - name: Lint Python
        run: uv run --locked --all-packages ruff check --config pyproject.toml apps/backend evals/generators

      - name: Scan product code with repository Semgrep rules
        run: |
          uv run --locked semgrep scan \
            --config .semgrep.yml \
            --error \
            --strict \
            --metrics=off \
            --exclude apps/backend/src/industry_platform/core/config.py \
            apps/backend/src apps/web/src packages

      - name: Type-check Python
        run: uv run --locked --all-packages mypy --config-file pyproject.toml

      - name: Test Python
        run: uv run --locked --all-packages pytest

      - name: Build Python package
        run: uv build --package industry-platform-backend

  fresh-postgresql-migration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENVIRONMENT: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: migration_ci
      POSTGRES_USER: migration_ci
      POSTGRES_PASSWORD: migration-ci-password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_PASSWORD: migration-ci-redis-password
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: migration-ci-minio
      MINIO_SECRET_KEY: migration-ci-minio-password
      MINIO_BUCKET: migration-ci-private
      MINIO_REGION: us-east-1
      MINIO_SECURE: "false"
      MILVUS_ENDPOINT: http://127.0.0.1:19530
      ELASTICSEARCH_ENDPOINT: http://127.0.0.1:9200
      KNOWLEDGE_INDEX_TIMEOUT_SECONDS: "30"
      REFRESH_TOKEN_HMAC_KEY_B64: cnJycnJycnJycnJycnJycnJycnJycnJycnJycnJycnI
      CSRF_TOKEN_HMAC_KEY_B64: Y2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2M
      DEVICE_TOKEN_HMAC_KEY_B64: ZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGQ
      BROWSER_TRUSTED_ORIGINS_JSON: '["https://localhost:5173"]'
      POSTGRES_TESTS_REQUIRED: "1"
      REDIS_TESTS_REQUIRED: "1"
      MINIO_TESTS_REQUIRED: "1"
      VECTOR_TESTS_REQUIRED: "1"
      ELASTICSEARCH_TESTS_REQUIRED: "1"
    services:
      postgres:
        image: postgres:16.14-bookworm
        env:
          POSTGRES_DB: migration_ci
          POSTGRES_USER: migration_ci
          POSTGRES_PASSWORD: migration-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migration_ci -d migration_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.2.15-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping | grep -q PONG || redis-cli -a
          migration-ci-redis-password --no-auth-warning ping | grep -q PONG"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pinned Python
        run: uv python install

      - name: Sync locked Python workspace
        run: uv sync --locked --all-packages

      - name: Generate ephemeral authentication keys
        shell: bash
        run: |
          uv run --locked --all-packages python - <<'PY'
          import json
          import os
          import secrets
          from base64 import urlsafe_b64encode

          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives.serialization import (
              Encoding,
              NoEncryption,
              PrivateFormat,
              PublicFormat,
          )

          def encode(value: bytes) -> str:
              return urlsafe_b64encode(value).rstrip(b"=").decode("ascii")

          private_key = Ed25519PrivateKey.generate()
          private_value = private_key.private_bytes(
              Encoding.Raw,
              PrivateFormat.Raw,
              NoEncryption(),
          )
          public_value = private_key.public_key().public_bytes(
              Encoding.Raw,
              PublicFormat.Raw,
          )
          key_id = "ci-ephemeral-key"
          environment = {
              "LOGIN_RATE_LIMIT_HMAC_KEY_B64": encode(secrets.token_bytes(32)),
              "REFRESH_RECOVERY_AEAD_KEY_B64": encode(secrets.token_bytes(32)),
              "ACCESS_TOKEN_CURRENT_KID": key_id,
              "ACCESS_TOKEN_PRIVATE_KEY_B64": encode(private_value),
              "ACCESS_TOKEN_PUBLIC_KEYS_JSON": json.dumps({key_id: encode(public_value)}),
          }

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as github_env:
              for name, value in environment.items():
                  github_env.write(f"{name}={value}\n")
          PY

      - name: Require authentication on Redis
        run: |
          docker exec "${{ job.services.redis.id }}" \
            redis-cli CONFIG SET requirepass "$REDIS_PASSWORD"
          docker exec "${{ job.services.redis.id }}" \
            redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping

      - name: Start and initialize private MinIO
        run: |
          docker run --detach --rm --name day2-minio \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z \
            server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs day2-minio
              exit 1
            fi
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh \
            --env MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            --env MINIO_BUCKET="$MINIO_BUCKET" \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z \
            -c 'set -eu; mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; mc mb --ignore-existing "local/$MINIO_BUCKET"; mc anonymous set none "local/$MINIO_BUCKET"'

      - name: Start Milvus and Elasticsearch
        run: |
          docker run --detach --rm --name day5-etcd --network host \
            quay.io/coreos/etcd:v3.5.25 \
            etcd --advertise-client-urls=http://127.0.0.1:2379 \
            --listen-client-urls=http://0.0.0.0:2379
          docker run --detach --rm --name day5-milvus --network host \
            --security-opt seccomp=unconfined \
            --env ETCD_ENDPOINTS=127.0.0.1:2379 \
            --env MINIO_ADDRESS=127.0.0.1:9000 \
            --env MINIO_ACCESS_KEY_ID="$MINIO_ACCESS_KEY" \
            --env MINIO_SECRET_ACCESS_KEY="$MINIO_SECRET_KEY" \
            --env MINIO_REGION=us-east-1 \
            milvusdb/milvus:v3.0.0 milvus run standalone
          # The ephemeral cluster stores only test fixtures, while hosted runners can
          # exceed Elasticsearch disk watermarks after pulling the service images.
          docker run --detach --rm --name day5-elasticsearch --network host \
            --env discovery.type=single-node \
            --env xpack.security.enabled=false \
            --env cluster.routing.allocation.disk.threshold_enabled=false \
            --env ES_JAVA_OPTS='-Xms512m -Xmx512m' \
            docker.elastic.co/elasticsearch/elasticsearch:9.5.1
          for attempt in $(seq 1 60); do
            if curl --fail --silent --connect-timeout 2 --max-time 5 \
              http://127.0.0.1:9091/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs day5-milvus
              exit 1
            fi
            sleep 2
          done
          for attempt in $(seq 1 60); do
            if curl --fail --silent --connect-timeout 2 --max-time 7 \
              'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' \
              >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs day5-elasticsearch
              exit 1
            fi
            sleep 2
          done
          for attempt in $(seq 1 30); do
            curl --silent --connect-timeout 2 --max-time 10 --request DELETE \
              'http://127.0.0.1:9200/ci-readiness-probe' \
              >/dev/null || true
            if curl --fail --silent --show-error --connect-timeout 2 --max-time 10 \
              --request PUT \
              'http://127.0.0.1:9200/ci-readiness-probe' \
              --header 'Content-Type: application/json' \
              --data '{"settings":{"number_of_shards":1,"number_of_replicas":0}}' \
              >/dev/null \
              && curl --fail --silent --show-error --connect-timeout 2 --max-time 10 \
                --request POST \
                'http://127.0.0.1:9200/ci-readiness-probe/_doc/ready?refresh=true' \
                --header 'Content-Type: application/json' \
                --data '{"ready":true}' \
                >/dev/null \
              && curl --fail --silent --show-error --connect-timeout 2 --max-time 10 \
                'http://127.0.0.1:9200/ci-readiness-probe/_doc/ready' \
                | grep --quiet '"found":true'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs day5-elasticsearch
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent --show-error --connect-timeout 2 --max-time 10 \
            --request DELETE \
            'http://127.0.0.1:9200/ci-readiness-probe' \
            >/dev/null

      - name: Exercise PostgreSQL, Redis, and MinIO integration paths
        run: |
          uv run --locked --all-packages pytest \
            --cov=industry_platform \
            --cov-branch \
            --cov-report=term \
            --cov-fail-under=80
          uv run --locked coverage report \
            --include='apps/backend/src/industry_platform/modules/memory/domain.py,apps/backend/src/industry_platform/modules/memory/service.py,apps/backend/src/industry_platform/modules/memory/eval.py,apps/backend/src/industry_platform/modules/evidence/domain.py,apps/backend/src/industry_platform/modules/evidence/service.py,apps/backend/src/industry_platform/modules/evidence/normalizer.py,apps/backend/src/industry_platform/modules/evidence/eval.py,apps/backend/src/industry_platform/modules/research/domain.py,apps/backend/src/industry_platform/modules/research/service.py,apps/backend/src/industry_platform/modules/research/eval.py,apps/backend/src/industry_platform/workflows/research/*.py' \
            --fail-under=90

  web-quality:
    name: Web quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up uv for API contract generation
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pinned Python for API contract generation
        run: uv python install

      - name: Sync locked Python workspace for generated contracts
        run: uv sync --locked --all-packages

      - name: Verify Node toolchain
        run: |
          node --version
          pnpm --version

      - name: Verify generated API contract is current
        run: pnpm run api:check

      - name: Verify release governance artifacts are current
        run: |
          pnpm run eval:release-recovery
          pnpm run eval:release-readiness
          git diff --exit-code -- \
            evals/manifests/sec-release-recovery-v1.json \
            evals/observations/sec-release-recovery-v1.json \
            evals/reports/sec-release-recovery-v1.json \
            evals/reports/sec-release-recovery-v1.md \
            evals/schemas/release-recovery-v1.schema.json \
            evals/manifests/sec-release-readiness-v1.json \
            evals/reports/sec-release-readiness-v1.json \
            evals/reports/sec-release-readiness-v1.md \
            evals/schemas/release-readiness-manifest-v1.schema.json \
            evals/schemas/release-readiness-report-v1.schema.json

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint web workspace
        run: pnpm run lint

      - name: Type-check web workspace
        run: pnpm run typecheck

      - name: Test web workspace
        run: pnpm run test

      - name: Enforce key web state coverage
        run: pnpm run test:coverage:web

      - name: Build web workspace
        run: pnpm run build

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENVIRONMENT: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: browser_ci
      POSTGRES_USER: browser_ci
      POSTGRES_PASSWORD: browser-ci-password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_PASSWORD: browser-ci-redis-password
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: browser-ci-minio
      MINIO_SECRET_KEY: browser-ci-minio-password
      MINIO_BUCKET: browser-ci-private
      MINIO_REGION: us-east-1
