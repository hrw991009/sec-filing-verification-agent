name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pinned Python
        run: uv python install

      - name: Sync locked Python workspace
        run: uv sync --locked --all-packages

      - name: Verify Python toolchain
        run: |
          uv --version
          uv run --locked python --version

      - name: Check Python formatting
        run: uv run --locked --all-packages ruff format --check --config pyproject.toml apps/backend

      - name: Lint Python
        run: uv run --locked --all-packages ruff check --config pyproject.toml apps/backend

      - name: Type-check Python
        run: uv run --locked --all-packages mypy --config-file pyproject.toml

      - name: Test Python
        run: uv run --locked --all-packages pytest

      - name: Build Python package
        run: uv build --package industry-platform-backend

  fresh-postgresql-migration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENVIRONMENT: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: migration_ci
      POSTGRES_USER: migration_ci
      POSTGRES_PASSWORD: migration-ci-password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_PASSWORD: migration-ci-redis-password
      REFRESH_TOKEN_HMAC_KEY_B64: cnJycnJycnJycnJycnJycnJycnJycnJycnJycnJycnI
      CSRF_TOKEN_HMAC_KEY_B64: Y2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2M
      DEVICE_TOKEN_HMAC_KEY_B64: ZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGQ
      BROWSER_TRUSTED_ORIGINS_JSON: '["https://localhost:5173"]'
      POSTGRES_TESTS_REQUIRED: "1"
      REDIS_TESTS_REQUIRED: "1"
    services:
      postgres:
        image: postgres:16.14-bookworm
        env:
          POSTGRES_DB: migration_ci
          POSTGRES_USER: migration_ci
          POSTGRES_PASSWORD: migration-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migration_ci -d migration_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.2.15-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping | grep -q PONG || redis-cli -a
          migration-ci-redis-password --no-auth-warning ping | grep -q PONG"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pinned Python
        run: uv python install

      - name: Sync locked Python workspace
        run: uv sync --locked --all-packages

      - name: Generate ephemeral authentication keys
        shell: bash
        run: |
          uv run --locked --all-packages python - <<'PY'
          import json
          import os
          import secrets
          from base64 import urlsafe_b64encode

          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives.serialization import (
              Encoding,
              NoEncryption,
              PrivateFormat,
              PublicFormat,
          )

          def encode(value: bytes) -> str:
              return urlsafe_b64encode(value).rstrip(b"=").decode("ascii")

          private_key = Ed25519PrivateKey.generate()
          private_value = private_key.private_bytes(
              Encoding.Raw,
              PrivateFormat.Raw,
              NoEncryption(),
          )
          public_value = private_key.public_key().public_bytes(
              Encoding.Raw,
              PublicFormat.Raw,
          )
          key_id = "ci-ephemeral-key"
          environment = {
              "LOGIN_RATE_LIMIT_HMAC_KEY_B64": encode(secrets.token_bytes(32)),
              "REFRESH_RECOVERY_AEAD_KEY_B64": encode(secrets.token_bytes(32)),
              "ACCESS_TOKEN_CURRENT_KID": key_id,
              "ACCESS_TOKEN_PRIVATE_KEY_B64": encode(private_value),
              "ACCESS_TOKEN_PUBLIC_KEYS_JSON": json.dumps({key_id: encode(public_value)}),
          }

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as github_env:
              for name, value in environment.items():
                  github_env.write(f"{name}={value}\n")
          PY

      - name: Require authentication on Redis
        run: |
          docker exec "${{ job.services.redis.id }}" \
            redis-cli CONFIG SET requirepass "$REDIS_PASSWORD"
          docker exec "${{ job.services.redis.id }}" \
            redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping

      - name: Exercise PostgreSQL and Redis integration paths
        run: >-
          uv run --locked --all-packages pytest
          apps/backend/tests/integration

  web-quality:
    name: Web quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Node toolchain
        run: |
          node --version
          pnpm --version

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint web workspace
        run: pnpm run lint

      - name: Type-check web workspace
        run: pnpm run typecheck

      - name: Test web workspace
        run: pnpm run test

      - name: Build web workspace
        run: pnpm run build

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Test production build in Chromium
        run: pnpm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 3

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Install pinned Python
        run: uv python install

      - name: Audit locked Python dependencies
        run: uv audit --locked

  node-dependency-audit:
    name: Node dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Audit locked Node dependencies
        run: pnpm audit --audit-level high

  secret-history:
    name: Secret history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan pushed commits for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.30.1"

      - name: Scan complete Git history
        run: gitleaks git --redact --verbose --log-opts="--all" .
