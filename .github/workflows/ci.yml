      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install pinned Python
        run: uv python install

      - name: Sync locked backend
        run: uv sync --locked --package industry-platform-backend

      - name: Generate ephemeral authentication keys
        shell: bash
        run: |
          uv run --locked --all-packages python - <<'PY'
          import json
          import os
          import secrets
          from base64 import urlsafe_b64encode

          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives.serialization import (
              Encoding,
              NoEncryption,
              PrivateFormat,
              PublicFormat,
          )

          def encode(value: bytes) -> str:
              return urlsafe_b64encode(value).rstrip(b"=").decode("ascii")

          private_key = Ed25519PrivateKey.generate()
          private_value = private_key.private_bytes(
              Encoding.Raw,
              PrivateFormat.Raw,
              NoEncryption(),
          )
          public_value = private_key.public_key().public_bytes(
              Encoding.Raw,
              PublicFormat.Raw,
          )
          key_id = "browser-ci-ephemeral-key"
          environment = {
              "LOGIN_RATE_LIMIT_HMAC_KEY_B64": encode(secrets.token_bytes(32)),
              "REFRESH_RECOVERY_AEAD_KEY_B64": encode(secrets.token_bytes(32)),
              "ACCESS_TOKEN_CURRENT_KID": key_id,
              "ACCESS_TOKEN_PRIVATE_KEY_B64": encode(private_value),
              "ACCESS_TOKEN_PUBLIC_KEYS_JSON": json.dumps({key_id: encode(public_value)}),
          }

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as github_env:
              for name, value in environment.items():
                  github_env.write(f"{name}={value}\n")
          PY

      - name: Require authentication on Redis
        run: |
          docker exec "${{ job.services.redis.id }}" \
            redis-cli CONFIG SET requirepass "$REDIS_PASSWORD"
          docker exec "${{ job.services.redis.id }}" \
            redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping

      - name: Start and initialize private MinIO
        run: |
          docker run --detach --rm --name browser-day2-minio \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_API_CORS_ALLOW_ORIGIN=https://localhost:5173 \
            --env MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z \
            server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs browser-day2-minio
              exit 1
            fi
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh \
            --env MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            --env MINIO_BUCKET="$MINIO_BUCKET" \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z \
            -c 'set -eu; mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; mc mb --ignore-existing "local/$MINIO_BUCKET"; mc anonymous set none "local/$MINIO_BUCKET"'

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Test the real identity lifecycle in Chromium
        run: pnpm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 3

  python-dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Install pinned Python
        run: uv python install

      - name: Sync locked Python workspace for license inspection
        run: uv sync --locked --all-packages

      - name: Audit locked Python dependencies
        run: uv audit --locked

      - name: Reject unreviewed Python package licenses
        run: uv run --locked pip-licenses --summary

  node-dependency-audit:
    name: Node dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install locked Node dependencies for license inspection
        run: pnpm install --frozen-lockfile

      - name: Audit locked Node dependencies
        run: pnpm audit --audit-level high

      - name: Reject unreviewed Node package licenses and require notices
        run: |
          pnpm exec license-checker-rseidelsohn \
            --excludePrivatePackages \
            --onlyAllow 'MIT;ISC;Apache-2.0;BlueOak-1.0.0;BSD-2-Clause;BSD-3-Clause;CC0-1.0;MIT-0;MPL-2.0;0BSD;Python-2.0;CC-BY-4.0;CC-BY-3.0;(MIT AND CC-BY-3.0);(MIT OR CC0-1.0)' \
            --summary
          test -s docs/security/third-party-notices.md

  secret-history:
    name: Secret history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan pushed commits for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.30.1"

      - name: Scan complete Git history
        run: gitleaks git --redact --verbose --log-opts="--all" .
